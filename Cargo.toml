[package]
name = "jp-menus"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "jp-menus-app"
path = "src/main.rs"

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-storage = "0.4.0"
leptos = { version = "0.8.20", features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-sys = { version = "0.3", features = ["HtmlElement", "Window"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
